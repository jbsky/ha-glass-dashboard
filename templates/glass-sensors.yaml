# Glass Dashboard - Sensor Display Templates
# Templates for battery, humidity, temperature, door sensors

{
  "battery_level": {
    "template": "icon_tiny"
  },
  "humidity_template": {
    "template": "icon_tiny",
    "state": [
      {
        "value": 15,
        "operator": "<=",
        "color": "red",
        "icon": "mdi:water-percent-alert"
      },
      {
        "operator": "default",
        "color": "blue",
        "icon": "mdi:water-percent",
        "styles": {
          "card": [
            {
              "opacity": 0.5
            }
          ]
        }
      }
    ]
  },
  "temperature_template": {
    "template": "icon_tiny",
    "state": [
      {
        "value": 20,
        "operator": "<=",
        "color": "blue",
        "icon": "mdi:thermometer-minus"
      },
      {
        "value": 25,
        "operator": ">=",
        "color": "red",
        "icon": "mdi:thermometer-plus"
      },
      {
        "operator": "default",
        "color": "orange",
        "icon": "mdi:thermometer",
        "styles": {
          "card": [
            {
              "opacity": 0.5
            }
          ]
        }
      }
    ]
  },
  "door_template": {
    "template": "icon_tiny"
  },
  "battery_rack": {
    "variables": {
      "entities": [],
      "exclude": "",
      "columns": 6,
      "sort": "level",
      "low": 15,
      "warn": 30,
      "mid": 60,
      "color_low": "#db4437",
      "color_warn": "#ff9800",
      "color_mid": "#fdd835",
      "color_full": "#43a047",
      "color_unknown": "#78909C",
      "width": "26px",
      "height": "46px",
      "gap": "10px 6px",
      "pulse_low": "battery-low 1.6s ease-in-out infinite",
      "name_strip": "\\s*(?:niveau\\s+(?:de\\s+)?)?batter(?:y|ie)(?:\\s*(?:level|state|status))?\\s*$",
      "text_levels": {
        "empty": 0,
        "critical": 5,
        "very_low": 10,
        "low": 15,
        "medium": 50,
        "normal": 60,
        "ok": 60,
        "good": 75,
        "high": 90,
        "full": 100
      },
      "text_labels": {
        "empty": "min",
        "critical": "!",
        "very_low": "low",
        "medium": "med",
        "normal": "ok",
        "good": "ok"
      }
    },
    "show_icon": false,
    "show_name": false,
    "show_state": false,
    "tap_action": {
      "action": "none"
    },
    "hold_action": {
      "action": "none"
    },
    "triggers_update": "[[[\n  const levels = variables.text_levels || {};\n  const labels = variables.text_labels || {};\n  const read = id => {\n    const s = states[id];\n    if (!s) return null;\n    const domain = id.split('.')[0];\n    const dc = s.attributes.device_class;\n    const num = Number(s.state);\n    if (s.state !== '' && !isNaN(num)\n        && (dc === 'battery'\n            || (/batter/i.test(id) && s.attributes.unit_of_measurement === '%')))\n      return {pct: Math.max(0, Math.min(100, num)), label: String(Math.round(num)),\n              exact: true, rank: 0};\n    const word = String(s.state).toLowerCase().replace(/[\\s-]+/g, '_');\n    if (domain === 'sensor' && /batter/i.test(id) && levels[word] !== undefined)\n      return {pct: levels[word], label: labels[word] || word.slice(0, 4),\n              exact: false, rank: 1};\n    if (domain === 'binary_sensor' && dc === 'battery'\n        && (s.state === 'on' || s.state === 'off')) {\n      const key = s.state === 'on' ? 'low' : 'ok';\n      return {pct: levels[key], label: labels[key] || key, exact: false, rank: 2};\n    }\n    return null;\n  };\n\n  const stem = id => id.split('.').slice(1).join('.')\n    .replace(/_\\d+$/, '')\n    .replace(/_?batter(?:y|ie)(?:_?(?:state|level|status|low))?$/, '');\n  const listed = variables.entities || [];\n  let ids;\n  if (listed.length) {\n    ids = listed.filter(id => states[id] && read(id));\n  } else {\n    const best = {};\n    for (const id of Object.keys(states)) {\n      const domain = id.split('.')[0];\n      if (domain !== 'sensor' && domain !== 'binary_sensor') continue;\n      if (states[id].attributes.device_class !== 'battery' && !/batter/i.test(id)) continue;\n      const r = read(id);\n      if (!r) continue;\n      const key = stem(id);\n      if (!best[key] || r.rank < best[key].rank) best[key] = {id: id, rank: r.rank};\n    }\n    ids = Object.keys(best).map(k => best[k].id);\n  }\n  if (variables.exclude) {\n    const skip = new RegExp(variables.exclude, 'i');\n    ids = ids.filter(id => !skip.test(id));\n  }\n  return ids;\n]]]",
    "custom_fields": {
      "rack": "[[[\n  const esc = t => String(t).replace(/[&<>\"]/g, c =>\n    ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;'}[c]));\n  const shortName = id => {\n    const s = states[id];\n    const full = s.attributes.friendly_name || id;\n    const cut = full.replace(new RegExp(variables.name_strip, 'i'), '').trim();\n    return cut || full;\n  };\n  const color = v => {\n    if (isNaN(v)) return variables.color_unknown;\n    if (v <= variables.low) return variables.color_low;\n    if (v <= variables.warn) return variables.color_warn;\n    if (v <= variables.mid) return variables.color_mid;\n    return variables.color_full;\n  };\n\n  const levels = variables.text_levels || {};\n  const labels = variables.text_labels || {};\n  const read = id => {\n    const s = states[id];\n    if (!s) return null;\n    const domain = id.split('.')[0];\n    const dc = s.attributes.device_class;\n    const num = Number(s.state);\n    if (s.state !== '' && !isNaN(num)\n        && (dc === 'battery'\n            || (/batter/i.test(id) && s.attributes.unit_of_measurement === '%')))\n      return {pct: Math.max(0, Math.min(100, num)), label: String(Math.round(num)),\n              exact: true, rank: 0};\n    const word = String(s.state).toLowerCase().replace(/[\\s-]+/g, '_');\n    if (domain === 'sensor' && /batter/i.test(id) && levels[word] !== undefined)\n      return {pct: levels[word], label: labels[word] || word.slice(0, 4),\n              exact: false, rank: 1};\n    if (domain === 'binary_sensor' && dc === 'battery'\n        && (s.state === 'on' || s.state === 'off')) {\n      const key = s.state === 'on' ? 'low' : 'ok';\n      return {pct: levels[key], label: labels[key] || key, exact: false, rank: 2};\n    }\n    return null;\n  };\n\n  const stem = id => id.split('.').slice(1).join('.')\n    .replace(/_\\d+$/, '')\n    .replace(/_?batter(?:y|ie)(?:_?(?:state|level|status|low))?$/, '');\n  const listed = variables.entities || [];\n  let ids;\n  if (listed.length) {\n    ids = listed.filter(id => states[id] && read(id));\n  } else {\n    const best = {};\n    for (const id of Object.keys(states)) {\n      const domain = id.split('.')[0];\n      if (domain !== 'sensor' && domain !== 'binary_sensor') continue;\n      if (states[id].attributes.device_class !== 'battery' && !/batter/i.test(id)) continue;\n      const r = read(id);\n      if (!r) continue;\n      const key = stem(id);\n      if (!best[key] || r.rank < best[key].rank) best[key] = {id: id, rank: r.rank};\n    }\n    ids = Object.keys(best).map(k => best[k].id);\n  }\n  if (variables.exclude) {\n    const skip = new RegExp(variables.exclude, 'i');\n    ids = ids.filter(id => !skip.test(id));\n  }\n\n  const level = id => {\n    const r = read(id);\n    return r && r.pct !== undefined ? r.pct : 999;\n  };\n  if (variables.sort === 'level') ids.sort((a, b) => level(a) - level(b));\n  else if (variables.sort === 'name') ids.sort((a, b) => shortName(a).localeCompare(shortName(b)));\n\n  const cell = id => {\n    const r = read(id) || {pct: 0, label: '?', exact: false};\n    const pct = isNaN(Number(r.pct)) ? 0 : Math.max(0, Math.min(100, Number(r.pct)));\n    const c = r.label === '?' ? variables.color_unknown : color(pct);\n    const anim = (pct <= variables.low && variables.pulse_low !== 'none')\n      ? `animation:${variables.pulse_low};` : '';\n    // trait interrompu = niveau deduit d'un mot, pas mesure\n    const dashed = r.exact ? '' : 'border-style:dashed;';\n    const open = `this.dispatchEvent(new CustomEvent('hass-more-info',` +\n      `{detail:{entityId:'${id}'},bubbles:true,composed:true}))`;\n    return `<div class=\"batt-cell\" onclick=\"${open}\" title=\"${esc(states[id].attributes.friendly_name || id)}\">\n        <div class=\"batt-cap\" style=\"background:${c};\"></div>\n        <div class=\"batt-shell\" style=\"border-color:${c};${dashed}${anim}\">\n          <div class=\"batt-fill\" style=\"height:${pct}%;background:${c};\"></div>\n          <span class=\"batt-value${r.exact ? '' : ' batt-word'}\">${esc(r.label)}</span>\n        </div>\n        <div class=\"batt-name\">${esc(shortName(id))}</div>\n      </div>`;\n  };\n  if (!ids.length) return '';\n  const cols = Math.max(1, Number(variables.columns) || 1);\n  return `<div class=\"batt-grid\" style=\"grid-template-columns:repeat(${cols}, minmax(0, 1fr));\">` +\n    ids.map(cell).join('') + `</div>`;\n]]]"
    },
    "styles": {
      "card": [
        {
          "padding": "10px 8px"
        },
        {
          "--batt-width": "[[[ return variables.width ]]]"
        },
        {
          "--batt-height": "[[[ return variables.height ]]]"
        },
        {
          "--batt-gap": "[[[ return variables.gap ]]]"
        }
      ],
      "grid": [
        {
          "grid-template-areas": "\"rack\""
        }
      ],
      "custom_fields": {
        "rack": [
          {
            "width": "100%"
          },
          {
            "min-width": "0"
          }
        ]
      }
    },
    "extra_styles": "\n.batt-grid {\n  display: grid;\n  gap: var(--batt-gap, 10px 6px);\n  width: 100%;\n}\n.batt-cell {\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  gap: 3px;\n  min-width: 0;\n  /* the whole card is pointer-events:none (button-card, tap_action:none):\n     each cell takes them back to open its own more-info dialog */\n  pointer-events: auto;\n  cursor: pointer;\n}\n.batt-cap {\n  width: 10px;\n  height: 3px;\n  border-radius: 2px 2px 0 0;\n}\n.batt-shell {\n  position: relative;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  width: var(--batt-width, 26px);\n  height: var(--batt-height, 46px);\n  border: 2px solid;\n  border-radius: 5px;\n  overflow: hidden;\n  background: rgba(0, 0, 0, 0.3);\n}\n.batt-fill {\n  position: absolute;\n  left: 0;\n  right: 0;\n  bottom: 0;\n  transition: height 0.6s ease-in-out, background 0.4s ease-in-out;\n}\n.batt-value {\n  position: relative;\n  font-size: 10px;\n  font-weight: 700;\n  color: #fff;\n  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);\n}\n/* a word instead of a number: the device only reports low / medium / high */\n.batt-value.batt-word {\n  font-size: 8px;\n  letter-spacing: -0.2px;\n}\n.batt-name {\n  display: -webkit-box;\n  -webkit-line-clamp: 2;\n  -webkit-box-orient: vertical;\n  overflow: hidden;\n  max-width: 100%;\n  font-size: 9px;\n  line-height: 1.15;\n  text-align: center;\n  /* button-card wraps custom fields in a .ellipsis (nowrap): take that back */\n  white-space: normal;\n  overflow-wrap: anywhere;\n  color: var(--primary-text-color);\n  opacity: 0.85;\n  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.45);\n}\n@keyframes battery-low {\n  0%, 100% { box-shadow: 0 0 0 0 rgba(219, 68, 55, 0); }\n  50%      { box-shadow: 0 0 9px 2px rgba(219, 68, 55, 0.85); }\n}\n"
  }
}
