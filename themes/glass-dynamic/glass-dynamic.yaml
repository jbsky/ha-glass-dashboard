# Glass Dynamic Theme for Home Assistant
# Part of ha-glass-dashboard - https://github.com/jbsky/ha-glass-dashboard
#
# REQUIRES: UI eXtension (UIX) - https://github.com/Lint-Free-Technology/uix
#   Install via HACS, then add the integration in Settings > Devices & Services.
#   card-mod is NOT supported: it is broken since Home Assistant 2026.8 and its
#   author has stated no fix will be released (lovelace-card-mod#606).
#
# CONFIGURATION:
#   Replace 'weather.home' with your weather entity (e.g. weather.my_city)
#   Place background images in /config/www/backgrounds/weather/
#
# WITHOUT UIX the cards keep their glass look (native theme variables), but the
# weather background is lost.
#
weather-dynamic:
  uix-theme: weather-dynamic

  # Couleurs texte/icone pour fond sombre (photo meteo + glass)
  primary-text-color: "#FFFFFF"
  secondary-text-color: "rgba(255, 255, 255, 0.7)"
  disabled-text-color: "rgba(255, 255, 255, 0.4)"
  text-primary-color: "#FFFFFF"
  state-icon-color: "rgba(255, 255, 255, 0.8)"
  state-icon-active-color: "#FFC107"
  primary-color: "#64b5f6"
  accent-color: "#FFC107"
  paper-item-icon-color: "rgba(255, 255, 255, 0.8)"

  # Glass : 100% natif depuis HA 2024.x, plus aucun plugin requis.
  # ha-card.ts expose --ha-card-backdrop-filter / -border-width / -border-color.
  ha-card-background: "rgba(20, 20, 30, 0.55)"
  ha-card-backdrop-filter: "blur(12px)"
  ha-card-border-radius: "12px"
  ha-card-border-width: "1px"
  ha-card-border-color: "rgba(255, 255, 255, 0.08)"
  ha-card-box-shadow: "none"

  # Static fallback, painted natively. This is what shows while the dynamic one
  # below is not there yet -- and it is the whole point of this key.
  #
  # `lovelace-background` is an ordinary theme key: it travels inside
  # hass.themes with the rest of the theme and applyThemesOnElement puts it on
  # <hui-view-container> as soon as the theme is applied. No plugin, no
  # websocket, nothing to wait for. <hui-view-background> reads it
  # (getComputedStyle -> --lovelace-background) and, because the value contains
  # `fixed`, flips itself to `position: fixed` + `background-attachment: scroll`
  # -- the workaround Home Assistant ships for Safari iOS, which we inherit
  # instead of fighting it.
  lovelace-background: "center / cover no-repeat fixed url('/local/backgrounds/weather/partlycloudy.jpg')"

  # Weather-reactive, sun-aware background, layered over that fallback.
  #
  # It overrides the same custom property rather than painting <hui-view>:
  # <hui-view-container> is the common ancestor of <hui-view> and
  # <hui-view-background>, custom properties inherit downwards, so the native
  # element picks the new value up and repaints -- keeping the positioning it
  # already armed from the static value above.
  #
  # `!important` is not decoration: applyThemesOnElement writes the static
  # value as an INLINE style on <hui-view-container>, and an inline declaration
  # beats a stylesheet rule unless that rule is important.
  #
  # Painting <hui-view> directly (what the card-mod version did, and what this
  # theme did until now) is what made the background flaky. That rule only
  # exists once UIX has attached its style node to the light DOM of <hui-view>
  # *and* the server has answered the render_template subscription this Jinja
  # implies -- on a heavy `sections` view, measured at 3 to 5 times the delay of
  # a masonry one. Until then the view had no background at all, so a slow
  # phone shows the flat theme background. It also put
  # `background-attachment: fixed` on a tall scrolling element full of
  # `backdrop-filter` layers, the exact combination HA works around above.
  #
  # UIX still appends its style node to the light DOM of <hui-view>, i.e. inside
  # hui-root's shadow root. A <style> applies to its whole shadow tree wherever
  # it sits in it, so a rule on `hui-view-container` -- an ancestor -- matches
  # just as well as one on hui-view itself.
  #
  # Do NOT use `uix-drawer` + --uix-view-background here. UIX reads those
  # variables with getComputedStyle(ha-drawer), but a theme declared per view
  # (views[].theme in the Lovelace config) is only applied to
  # <hui-view-container>, a DESCENDANT of ha-drawer. Custom properties inherit
  # downwards only, so the drawer never sees them and nothing renders, with no
  # error anywhere. `uix-drawer` only works when the theme is selected globally
  # in the user profile.
  uix-view: |
    hui-view-container {
      {% set v = 2 %}
      {% set sun = states('sun.sun') %}
      {% set weather = states('weather.home') %}
      {% set is_night = (sun == 'below_horizon') %}
      {% set weather_images = {
          'clear-night': 'clearnight.jpg',
          'cloudy': 'cloudy.jpg',
          'fog': 'fog.jpg',
          'hail': 'hail.jpg',
          'lightning': 'lightning.jpg',
          'lightning-rainy': 'lightningrainy.jpg',
          'partlycloudy': 'partlycloudy.jpg',
          'pouring': 'pouring.jpg',
          'rainy': 'rainy.jpg',
          'snowy': 'snowy.jpg',
          'snowy-rainy': 'snowyrainy.jpg',
          'sunny': 'sunny.jpg',
          'windy': 'windy.jpg',
          'windy-variant': 'windyvariant.jpg',
          'exceptional': 'exceptional.jpg'
      } %}
      {% if is_night and weather in ['sunny', 'partlycloudy'] %}
        {% set img = 'clearnight.jpg' %}
      {% else %}
        {% set img = weather_images.get(weather, 'partlycloudy.jpg') %}
      {% endif %}
      --lovelace-background: center / cover no-repeat fixed url("/local/backgrounds/weather/{{ img }}?v={{ v }}") !important;
    }
